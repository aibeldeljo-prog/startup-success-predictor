<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Startup Success Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 80%;
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            background-color: #f5f5f5;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
        }

        .note {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Startup Success Prediction</h1>

        <p class="description">
            Enter startup information to predict the startup outcome.
        </p>

        <form method="POST">

            <!-- Total Funding -->

            <label for="funding">
                Total Funding (USD)
            </label>

            <input
                type="number"
                id="funding"
                name="funding"
                placeholder="Example: 5000000"
                step="any"
                required
            >


            <!-- Funding Rounds -->

            <label for="rounds">
                Number of Funding Rounds
            </label>

            <input
                type="number"
                id="rounds"
                name="rounds"
                placeholder="Example: 5"
                min="0"
                required
            >


            <!-- Milestones -->

            <label for="milestones">
                Number of Milestones
            </label>

            <input
                type="number"
                id="milestones"
                name="milestones"
                placeholder="Example: 3"
                min="0"
                required
            >


            <!-- Relationships -->

            <label for="relationships">
                Number of Relationships
            </label>

            <input
                type="number"
                id="relationships"
                name="relationships"
                placeholder="Example: 10"
                min="0"
                required
            >


            <!-- Average Participants -->

            <label for="participants">
                Average Participants
            </label>

            <input
                type="number"
                step="any"
                id="participants"
                name="participants"
                placeholder="Example: 2.5"
                min="0"
                required
            >


            <!-- Prediction Button -->

            <button type="submit">
                Predict Startup Success
            </button>


            <!-- Prediction Result -->

            {% if prediction %}

            <div class="result">
                {{ prediction }}
            </div>

            {% endif %}

        </form>

        <p class="note">
            This prediction is generated using a Random Forest machine learning model.
        </p>

    </div>

</body>

</html>
